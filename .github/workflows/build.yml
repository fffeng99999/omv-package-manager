name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    name: Lint (PHP + YAML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP RPC files
        run: |
          for f in $(find usr/share/openmediavault/engined -name '*.inc'); do
            php -l "$f"
          done

      - name: Validate JSON datamodels
        run: |
          for f in $(find usr/share/openmediavault/datamodels -name '*.json'); do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo "OK: ".$argv[1]."\n";' "$f"
          done

      - name: Set up Python (yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lint workbench YAML
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            usr/share/openmediavault/workbench

  build:
    name: Build .deb
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render build variables
        run: sh ./render-vars.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev debhelper build-essential

      - name: Verify changelog matches tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "tag=$TAG changelog=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "ERROR: tag version ($TAG) != changelog version ($VER)"
            exit 1
          fi

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv ../*.deb ../*.changes "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Inspect package
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/dist/*.deb)
          if dpkg-deb -f "$DEB" | grep -q '\${'; then
            echo "ERROR: unresolved placeholder left in package metadata (render-vars.sh not run?)"
            exit 1
          fi
          echo "== control =="; dpkg-deb -f "$DEB"
          echo "== contents =="; dpkg-deb -c "$DEB"

      - name: Upload artifact (branch/PR builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: openmediavault-pluginmgr-deb
          path: ${{ github.workspace }}/dist/*.deb

      - name: Create release and upload .deb (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "$GITHUB_WORKSPACE"/dist/*.deb
