version: "1.0"
type: component
data:
  name: omv-system-pluginmgr-tabs-page
  type: tabsPage
  config:
    tabs:
      # -------------------------------------------------------------------
      # Installed packages
      # -------------------------------------------------------------------
      - type: datatable
        label: _("Installed")
        config:
          hints:
            - type: warning
              text: _("Package operations may break your OpenMediaVault system. Make sure you have a current backup of your configuration before continuing. Packages starting with 'openmediavault' are protected against removal.")
          autoReload: false
          hasSearchField: true
          remoteSorting: true
          remotePaging: true
          stateId: 5f0a1c72-2a43-11ef-96f4-9f01516c7ae3
          rowId: package
          selectionType: single
          sorters:
            - dir: asc
              prop: package
          store:
            proxy:
              service: PkgMgr
              get:
                method: getInstalledListBg
                task: true
          columns:
            - name: _("Package")
              prop: package
              flexGrow: 2
              sortable: true
            - name: _("Version")
              prop: version
              flexGrow: 1
              sortable: true
            - name: _("Architecture")
              prop: architecture
              flexGrow: 1
              sortable: true
            - name: _("Size")
              prop: size
              flexGrow: 1
              sortable: true
              cellTemplateName: binaryUnit
            - name: _("Hold")
              prop: hold
              flexGrow: 1
              sortable: true
              cellTemplateName: checkIcon
            - name: _("Description")
              prop: description
              flexGrow: 3
              sortable: true
          actions:
            - type: iconButton
              icon: mdi:information-outline
              tooltip: _("Details")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/system/pluginmgr/details/{{ package | encodeuricomponent }}"
            - type: menu
              icon: mdi:wrench-outline
              tooltip: _("Actions")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              actions:
                - text: _("Preview")
                  icon: mdi:eye-outline
                  tooltip: _("Show what would happen before removing this package")
                  execute:
                    type: taskDialog
                    taskDialog:
                      config:
                        title: _("Preview of the operation")
                        startOnInit: true
                        request:
                          service: PkgMgr
                          method: preview
                          params:
                            packages:
                              - "{{ package }}"
                            action: remove
                - text: _("Hold")
                  icon: mdi:lock-outline
                  tooltip: _("Prevent the package from being upgraded")
                  enabledConstraints:
                    constraint:
                      - operator: falsy
                        arg0:
                          prop: hold
                  execute:
                    type: request
                    request:
                      service: PkgMgr
                      method: setHold
                      params:
                        package: "{{ package }}"
                        hold: true
                      successNotification: _("The package is now held. It will not be upgraded automatically.")
                - text: _("Unhold")
                  icon: mdi:lock-open-variant-outline
                  tooltip: _("Allow the package to be upgraded again")
                  enabledConstraints:
                    constraint:
                      - operator: truthy
                        arg0:
                          prop: hold
                  execute:
                    type: request
                    request:
                      service: PkgMgr
                      method: setHold
                      params:
                        package: "{{ package }}"
                        hold: false
                      successNotification: _("The package is no longer held and will be upgraded again.")
            - type: iconButton
              icon: mdi:delete-alert
              tooltip: _("Remove")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to remove the selected package? Removing packages may break your system. Packages starting with 'openmediavault' will be refused.")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Removing package")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: removePkg
                      params:
                        packages:
                          - "{{ package }}"
                        purge: false
                        force: false
            - type: iconButton
              icon: mdi:delete-off-outline
              tooltip: _("Purge")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to purge the selected package? Purging also removes its configuration files.")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Purging package")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: removePkg
                      params:
                        packages:
                          - "{{ package }}"
                        purge: true
                        force: false
      # -------------------------------------------------------------------
      # Available packages
      # -------------------------------------------------------------------
      - type: datatable
        label: _("Available")
        config:
          hints:
            - type: warning
              text: _("Installing packages may break your OpenMediaVault system. Make sure you have a current backup of your configuration before continuing.")
          autoReload: false
          hasSearchField: true
          remoteSorting: true
          remotePaging: true
          stateId: 6a1b2d83-2a43-11ef-96f4-9f01516c7ae3
          rowId: package
          selectionType: single
          sorters:
            - dir: asc
              prop: package
          store:
            proxy:
              service: PkgMgr
              get:
                method: getAvailableListBg
                task: true
          columns:
            - name: _("Package")
              prop: package
              flexGrow: 2
              sortable: true
            - name: _("Version")
              prop: version
              flexGrow: 1
              sortable: true
            - name: _("Architecture")
              prop: architecture
              flexGrow: 1
              sortable: true
            - name: _("Description")
              prop: description
              flexGrow: 3
              sortable: true
          actions:
            - type: iconButton
              icon: mdi:information-outline
              tooltip: _("Details")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/system/pluginmgr/details/{{ package | encodeuricomponent }}"
            - type: iconButton
              icon: mdi:eye-outline
              tooltip: _("Preview")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Preview of the operation")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: preview
                      params:
                        packages:
                          - "{{ package }}"
                        action: install
            - type: iconButton
              icon: download
              tooltip: _("Install")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to install the selected package?")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Installing package")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: installPkg
                      params:
                        packages:
                          - "{{ package }}"
      # -------------------------------------------------------------------
      # Upgradable packages
      # -------------------------------------------------------------------
      - type: datatable
        label: _("Updates")
        config:
          hints:
            - type: warning
              text: _("Upgrading packages may break your OpenMediaVault system. Make sure you have a current backup of your configuration before continuing.")
          autoReload: false
          hasSearchField: true
          remoteSorting: true
          remotePaging: true
          stateId: 7b2c3e94-2a43-11ef-96f4-9f01516c7ae3
          rowId: package
          selectionType: single
          sorters:
            - dir: asc
              prop: package
          store:
            proxy:
              service: PkgMgr
              get:
                method: getUpgradableListBg
                task: true
          columns:
            - name: _("Package")
              prop: package
              flexGrow: 2
              sortable: true
            - name: _("Current")
              prop: current
              flexGrow: 1
              sortable: true
            - name: _("New")
              prop: new
              flexGrow: 1
              sortable: true
            - name: _("Architecture")
              prop: architecture
              flexGrow: 1
              sortable: true
          actions:
            - type: iconButton
              icon: mdi:information-outline
              tooltip: _("Details")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/system/pluginmgr/details/{{ package | encodeuricomponent }}"
            - type: iconButton
              icon: refresh
              tooltip: _("Update lists")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Updating the package index files")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: updateLists
            - type: iconButton
              icon: mdi:package-up
              tooltip: _("Upgrade all")
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to upgrade all available packages? This operation may take a long time and may break your OpenMediaVault system.")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Upgrading all packages")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: upgradeAll
                      params:
                        force: false
            - type: iconButton
              icon: mdi:broom
              tooltip: _("Autoremove")
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to remove all packages that were automatically installed and are no longer required?")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Removing unneeded packages")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: autoremove
                      params:
                        force: false
            - type: iconButton
              icon: upload
              tooltip: _("Upgrade")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to upgrade the selected package?")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Upgrading package")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: installPkg
                      params:
                        packages:
                          - "{{ package }}"
      # -------------------------------------------------------------------
      # Local .deb installation (upload from the computer or select a
      # .deb file in /tmp of the system)
      # -------------------------------------------------------------------
      - type: datatable
        label: _("Local deb")
        config:
          hints:
            - type: warning
              text: _("Upload .deb files from your computer via the upload button (opens a new browser tab), or select an existing .deb file in the /tmp directory of this system. Uploaded files are stored in /tmp and are cleaned up automatically by the system. Installing packages may break your OpenMediaVault system. Make sure you have a current backup of your configuration before continuing.")
          autoReload: false
          hasSearchField: true
          remoteSorting: true
          remotePaging: true
          stateId: 8c3d4fa5-2a43-11ef-96f4-9f01516c7ae3
          rowId: filename
          selectionType: single
          sorters:
            - dir: asc
              prop: filename
          store:
            proxy:
              service: PkgMgr
              get:
                method: getLocalDebListBg
                task: true
          columns:
            - name: _("Filename")
              prop: filename
              flexGrow: 2
              sortable: true
            - name: _("Package")
              prop: package
              flexGrow: 2
              sortable: true
            - name: _("Version")
              prop: version
              flexGrow: 1
              sortable: true
            - name: _("Architecture")
              prop: architecture
              flexGrow: 1
              sortable: true
            - name: _("Size")
              prop: size
              flexGrow: 1
              sortable: true
              cellTemplateName: binaryUnit
            - name: _("Modified")
              prop: mtimeText
              flexGrow: 1
              sortable: true
          actions:
            - type: iconButton
              icon: upload
              tooltip: _("Upload .deb file from your computer")
              execute:
                type: url
                url: "/externalRedirect/%2Fpkgupload.php"
            - type: iconButton
              icon: mdi:information-outline
              tooltip: _("Show package info")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: request
                request:
                  service: PkgMgr
                  method: getLocalDebInfo
                  params:
                    filename: "{{ filename }}"
                  successNotification: _("Package {{ _response['package'] }} version {{ _response['version'] }} architecture {{ _response['architecture'] }}")
            - type: iconButton
              icon: download
              tooltip: _("Install")
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to install the selected .deb package? Installing packages may break your system.")
              execute:
                type: taskDialog
                taskDialog:
                  config:
                    title: _("Installing package")
                    startOnInit: true
                    request:
                      service: PkgMgr
                      method: installLocalDeb
                      params:
                        filename: "{{ filename }}"
                        force: false
      # -------------------------------------------------------------------
      # .deb installation from a shared folder
      # -------------------------------------------------------------------
      - type: form
        label: _("Shared folder")
        config:
          hints:
            - type: warning
              text: _("Installing packages may break your OpenMediaVault system. Make sure you have a current backup of your configuration before continuing.")
          request:
            service: PkgMgr
            post:
              method: installDeb
              task: true
          fields:
            - type: paragraph
              title: _("Select the shared folder and the .deb file to install. Upload the .deb file to a shared folder first (e.g. via File Browser or SMB).")
            - type: sharedFolderSelect
              name: sharedfolderref
              label: _("Shared folder")
              hint: _("The shared folder that contains the .deb file.")
              value: ""
            - type: folderBrowser
              name: debpath
              label: _("Folder")
              hint: _("The directory below the shared folder root that contains the .deb file.")
              value: ""
              dirType: sharedfolder
              dirRefIdField: sharedfolderref
            - type: textInput
              name: filename
              label: _("Filename")
              hint: _("The name of the .deb file, e.g. 'openmediavault-example_1.0_all.deb'.")
              value: ""
              validators:
                required: true
          buttons:
            - type: button
              text: _("Show package info")
              execute:
                type: request
                request:
                  service: PkgMgr
                  method: getDebInfo
                  params:
                    sharedfolderref: "{{ sharedfolderref }}"
                    debpath: "{{ debpath }}"
                    filename: "{{ filename }}"
                  successNotification: _("Package {{ _response['package'] }} version {{ _response['version'] }} architecture {{ _response['architecture'] }}")
            - template: submit
              text: _("Install")
              confirmationDialogConfig:
                template: confirmation
                message: _("Do you really want to install this local .deb package? Installing packages may break your system.")
